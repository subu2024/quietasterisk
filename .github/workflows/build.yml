name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build (strict: any warning fails the job)
        env:
          BLOG_NEWSLETTER_API_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}
        run: python build.py --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
      # Deploy step goes here (S3 sync, GitHub Pages, Netlify, ...). The folder to publish is dist/.
