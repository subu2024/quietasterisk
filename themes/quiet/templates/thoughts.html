{% extends "base.html" %}
{% import "macros.html" as m %}
{% block content %}
{{ m.hero(copy.page_title, eyebrow=copy.page_label, description=copy.page_intro, size="compact") }}
<section class="section section--flush-top">
  <div class="container">
    <div class="thought-feed">
      {% for t in thoughts %}
      <article class="thought-item">
        <p class="thought-text">{{ t.text }}</p>
        {% if t.iso_date %}<time class="thought-date" datetime="{{ t.iso_date }}">{{ t.date_display }}</time>{% endif %}
      </article>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
